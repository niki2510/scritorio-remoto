<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escritorio Remoto Bravo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1115; color: #e5e7eb; font-family: "Segoe UI", sans-serif; }
    main { width: min(520px, calc(100% - 32px)); padding: 32px; border: 1px solid #2a2e37; border-radius: 14px; background: #171a21; box-shadow: 0 20px 60px #0008; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { color: #9ca3af; line-height: 1.5; }
    label { display: block; margin: 24px 0 7px; font-size: 13px; color: #cbd5e1; }
    input { width: 100%; padding: 12px; border: 1px solid #374151; border-radius: 7px; background: #0d0f14; color: #fff; font-size: 15px; }
    button { width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 7px; background: #3b82f6; color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #2563eb; }
    #message { min-height: 20px; margin-top: 12px; color: #fca5a5; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>🖥️ Escritorio Remoto Bravo</h1>
    <p>Indica el servidor al que quieres conectarte. Iniciarás sesión dentro de la aplicación.</p>
    <label for="server">Dirección del servidor</label>
    <input id="server" type="url" spellcheck="false" value="http://localhost:5000">
    <button id="connect" type="button">Conectar</button>
    <div id="message"></div>
  </main>
  <script>
    const input = document.getElementById("server");
    const button = document.getElementById("connect");
    const message = document.getElementById("message");
    window.desktopRemote.currentServer().then((url) => { input.value = url; });
    async function connect() {
      message.textContent = "Conectando…";
      button.disabled = true;
      const result = await window.desktopRemote.connect(input.value);
      if (!result.ok) {
        message.textContent = result.error;
        button.disabled = false;
      }
    }
    button.addEventListener("click", connect);
    input.addEventListener("keydown", (event) => { if (event.key === "Enter") connect(); });
  </script>
</body>
</html>
