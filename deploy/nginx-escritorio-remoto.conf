# Ejemplo de reverse proxy con TLS para exponer la app a través de
# remoto.example.com (sustituye este dominio por el tuyo).
#
# Requiere soporte de WebSocket (usado por Socket.IO) y, preferiblemente,
# un certificado TLS gestionado con certbot/Let's Encrypt.

server {
    listen 80;
    server_name remoto.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name remoto.example.com;

    ssl_certificate     /etc/letsencrypt/live/remoto.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remoto.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Necesario para que funcione el WebSocket de Socket.IO.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }
}
